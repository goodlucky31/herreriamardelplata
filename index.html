import weasyprint

html_content = """
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herrería Industrial & Estructuras</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1c1f24;
            --accent: #d97706;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 20px 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 40px;
        }

        h1 {
            color: var(--accent);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
        }

        .admin-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .admin-panel h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #121417;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button.btn-primary {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        .catalog-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
        }

        .product-price {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 15px;
            white-space: pre-line;
        }

        .btn-buy {
            display: block;
            background-color: #25d366;
            color: #fff;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn-delete {
            background: transparent;
            color: #ef4444;
            border: none;
            padding: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Herrería & Estructuras</h1>
        <p class="subtitle">Catálogo digital de Pérgolas, Portones y Trabajos a Medida</p>
    </header>

    <!-- Panel para agregar productos (Solo tuyo) -->
    <section class="admin-panel">
        <h2>🛠️ Cargar / Editar Nuevo Producto</h2>
        <form id="productForm">
            <div class="form-group">
                <label>Nombre del Producto / Modelo:</label>
                <input type="text" id="title" placeholder="Ej: Pérgola Bioclimática 4x3m" required>
            </div>
            <div class="form-group">
                <label>Precio ($):</label>
                <input type="number" id="price" placeholder="Ej: 450000" required>
            </div>
            <div class="form-group">
                <label>Imagen del Producto:</label>
                <input type="file" id="imageInput" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Descripción y Detalles Técnicos:</label>
                <textarea id="description" rows="3" placeholder="Ej: Estructura de caño 100x100, pintura al horno anticorrosiva, incluye instalación." required></textarea>
            </div>
            <button type="submit" class="btn-primary">Publicar Producto en el Catálogo</button>
        </form>
    </section>

    <!-- Grilla del Catálogo -->
    <h2>📦 Catálogo Disponible</h2>
    <div id="catalogGrid">
        <!-- Los productos subidos aparecerán aquí dinámicamente -->
    </div>
</div>

<script>
    const form = document.getElementById('productForm');
    const catalogGrid = document.getElementById('catalogGrid');

    // Cargar productos guardados al iniciar
    document.addEventListener('DOMContentLoaded', loadProducts);

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const title = document.getElementById('title').value;
        const price = document.getElementById('price').value;
        const description = document.getElementById('description').value;
        const imageInput = document.getElementById('imageInput');

        const reader = new FileReader();
        reader.onload = function(e) {
            const imageData = e.target.result;

            const product = {
                id: Date.now(),
                title,
                price,
                description,
                image: imageData
            };

            saveProduct(product);
            form.reset();
            loadProducts();
        };

        if (imageInput.files[0]) {
            reader.readAsDataURL(imageInput.files[0]);
        }
    });

    function saveProduct(product) {
        let products = JSON.parse(localStorage.getItem('my_products') || '[]');
        products.push(product);
        localStorage.setItem('my_products', JSON.stringify(products));
    }

    function deleteProduct(id) {
        let products = JSON.parse(localStorage.getItem('my_products') || '[]');
        products = products.filter(p => p.id !== id);
        localStorage.setItem('my_products', JSON.stringify(products));
        loadProducts();
    }

    function loadProducts() {
        catalogGrid.innerHTML = '';
        const products = JSON.parse(localStorage.getItem('my_products') || '[]');

        if (products.length === 0) {
            catalogGrid.innerHTML = '<p style="color: var(--text-muted);">No hay productos publicados aún. Completa el formulario de arriba para agregar el primero.</p>';
            return;
        }

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            // Generar enlace de WhatsApp con el pedido
            const waMessage = encodeURIComponent(`Hola, me interesa solicitar información/compra sobre: ${product.title} (Precio: $${product.price})`);
            const waUrl = `https://wa.me/?text=${waMessage}`;

            card.innerHTML = `
                <img src="${product.image}" class="product-img" alt="${product.title}">
                <div class="product-info">
                    <h3 class="product-title">${product.title}</h3>
                    <div class="product-price">$${Number(product.price).toLocaleString()}</div>
                    <div class="product-desc">${product.description}</div>
                    <a href="${waUrl}" target="_blank" class="btn-buy">Consultar / Comprar por WhatsApp</a>
                    <button class="btn-delete" onclick="deleteProduct(${product.id})">🗑️ Eliminar Producto</button>
                </div>
            `;
            catalogGrid.appendChild(card);
        });
    }
</script>

</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)
