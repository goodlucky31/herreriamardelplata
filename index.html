<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herrería Mar del Plata | Estructuras & Diseño Industrial</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0d10;
            --bg-card: #15181e;
            --header-bg: #101318;
            --accent-gold: #c59b27;
            --accent-gold-hover: #e0b332;
            --accent-mp: #009ee3;
            --accent-wa: #25d366;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #232730;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 80px;
        }

        /* NAVBAR */
        nav {
            background-color: var(--header-bg);
            border-bottom: 2px solid var(--accent-gold);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            overflow: hidden;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            display: block;
        }

        .btn-admin-access {
            background: rgba(197, 155, 39, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-admin-access:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(180deg, rgba(11,13,16,0.7) 0%, rgba(11,13,16,0.98) 100%),
                        url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80') center/cover;
            padding: 50px 20px 35px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 1.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: var(--accent-gold);
        }

        .hero p {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto 20px auto;
        }

        /* CATEGORÍAS - NAVEGACIÓN Y FILTROS */
        .categories-nav-wrapper {
            background-color: #0e1014;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            position: sticky;
            top: 76px;
            z-index: 900;
        }

        .categories-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
        }

        .cat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        /* MAIN CONTAINER & GRID */
        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 640px) {
            .catalog-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 960px) {
            .catalog-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-color: #333a46;
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #000;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0,0,0,0.8);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 1.35rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            flex-grow: 1;
            white-space: pre-line;
        }

        .product-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-mp {
            background-color: var(--accent-mp);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn-wa {
            background-color: transparent;
            color: var(--accent-wa);
            border: 1px solid var(--accent-wa);
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            text-transform: uppercase;
        }

        /* MODAL ADMIN PRIVADO */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            overflow-y: auto;
            padding: 20px;
        }

        .admin-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-content {
            background-color: #1a1e26;
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .close-admin {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .admin-content h3 {
            color: var(--accent-gold);
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            padding: 10px;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-save-settings {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
        }

        .btn-delete-item {
            background: transparent;
            color: #ef4444;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: underline;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px; right: 20px;
            background-color: var(--accent-wa);
            color: #fff;
            border-radius: 50px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="brand-container">
            <div class="brand-logo-wrapper">
                <img src="" id="navLogo" class="brand-logo" alt="Herrería Logo">
            </div>
            <div>
                <span class="brand-title">Herrería Mar del Plata</span>
                <span class="brand-subtitle">Estructuras & Diseño Industrial</span>
            </div>
        </div>
        <button class="btn-admin-access" onclick="toggleAdminModal()"><i class="fa-solid fa-gear"></i> Panel Mi Web</button>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Catálogo de <span>Herrería Premium</span></h1>
        <p>Estructuras, cierres y mobiliario a medida con pintura anticorrosiva de máxima resistencia.</p>
    </section>

    <!-- BARRA DE CATEGORÍAS -->
    <div class="categories-nav-wrapper">
        <div class="categories-container" id="categoryBar">
            <button class="cat-btn active" onclick="filterCategory('todas')"><i class="fa-solid fa-border-all"></i> Todos</button>
            <button class="cat-btn" onclick="filterCategory('portones')"><i class="fa-solid fa-door-closed"></i> Portones</button>
            <button class="cat-btn" onclick="filterCategory('pergolas')"><i class="fa-solid fa-umbrella-beach"></i> Pérgolas</button>
            <button class="cat-btn" onclick="filterCategory('rejas')"><i class="fa-solid fa-shield-halved"></i> Rejas</button>
            <button class="cat-btn" onclick="filterCategory('parrillas')"><i class="fa-solid fa-fire"></i> Parrillas</button>
            <button class="cat-btn" onclick="filterCategory('escaleras')"><i class="fa-solid fa-stairs"></i> Escaleras</button>
            <button class="cat-btn" onclick="filterCategory('sillas')"><i class="fa-solid fa-chair"></i> Sillas</button>
            <button class="cat-btn" onclick="filterCategory('muebleria')"><i class="fa-solid fa-couch"></i> Mueblería</button>
        </div>
    </div>

    <!-- MAIN GRID DE PRODUCTOS -->
    <div class="main-container">
        <div id="catalogGrid" class="catalog-grid"></div>
    </div>

    <!-- BOTÓN WHATSAPP -->
    <a href="#" id="floatWaBtn" target="_blank" class="whatsapp-float">
        <i class="fa-brands fa-whatsapp fa-lg"></i> Consultar por WhatsApp
    </a>

    <!-- MODAL ADMIN -->
    <div id="adminModal" class="admin-modal">
        <div class="admin-content">
            <button class="close-admin" onclick="toggleAdminModal()">&times;</button>
            <h3><i class="fa-solid fa-sliders"></i> Panel Administrador</h3>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Tu Teléfono WhatsApp (ej: 5492231234567):</label>
                <input type="text" id="cfgPhone" placeholder="5492231234567">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Logo de la Empresa (Subir archivo):</label>
                <input type="file" id="cfgLogoInput" accept="image/*">
            </div>

            <hr style="border-color: var(--border-color); margin: 20px 0;">

            <h4 style="color: #fff; margin-bottom: 12px;">Cargar Nuevo Trabajo o Producto</h4>
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Categoría:</label>
                        <select id="pCategory" required>
                            <option value="portones">Portones</option>
                            <option value="pergolas">Pérgolas</option>
                            <option value="rejas">Rejas</option>
                            <option value="parrillas">Parrillas</option>
                            <option value="escaleras">Escaleras</option>
                            <option value="sillas">Sillas</option>
                            <option value="muebleria">Mueblería</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Título / Nombre del Trabajo:</label>
                        <input type="text" id="pTitle" placeholder="Ej: Portón Levadizo Automatizado" required>
                    </div>
                    <div class="form-group">
                        <label>Precio ($ ARS):</label>
                        <input type="number" id="pPrice" placeholder="Ej: 450000" required>
                    </div>
                    <div class="form-group">
                        <label>Link de Pago Mercado Pago (Opcional):</label>
                        <input type="url" id="pMpLink" placeholder="https://mpago.la/...">
                    </div>
                    <div class="form-group">
                        <label>Foto (Subir archivo de imagen):</label>
                        <input type="file" id="pImgInput" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción / Medidas / Materiales:</label>
                        <textarea id="pDesc" rows="3" placeholder="Ej: Estructura en caño 80x40mm, pintura al horno y tratamiento anticorrosivo." required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-save-settings">🚀 Guardar y Publicar</button>
            </form>
        </div>
    </div>

    <script>
        let currentFilter = 'todas';

        const defaultConfig = {
            phone: '5492231234567',
            logo: 'https://via.placeholder.com/150/111/fff?text=HMP'
        };

        function getConfig() {
            return JSON.parse(localStorage.getItem('hmdp_config')) || defaultConfig;
        }

        function saveConfig(cfg) {
            localStorage.setItem('hmdp_config', JSON.stringify(cfg));
            applyConfig();
        }

        function applyConfig() {
            const cfg = getConfig();
            document.getElementById('cfgPhone').value = cfg.phone || '';
            const waMsg = encodeURIComponent("Hola Herrería Mar del Plata! Quiero solicitar un presupuesto.");
            document.getElementById('floatWaBtn').href = `https://wa.me/${cfg.phone}?text=${waMsg}`;
            if (cfg.logo) {
                document.getElementById('navLogo').src = cfg.logo;
            }
        }

        document.getElementById('cfgPhone').addEventListener('change', function() {
            const cfg = getConfig();
            cfg.phone = this.value;
            saveConfig(cfg);
        });

        document.getElementById('cfgLogoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const cfg = getConfig();
                    cfg.logo = evt.target.result;
                    saveConfig(cfg);
                };
                reader.readAsDataURL(file);
            }
        });

        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('active');
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            loadProducts();
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const category = document.getElementById('pCategory').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            const mpLink = document.getElementById('pMpLink').value;
            const desc = document.getElementById('pDesc').value;
            const imgInput = document.getElementById('pImgInput');

            const reader = new FileReader();
            reader.onload = function(evt) {
                const newProduct = {
                    id: Date.now(),
                    category,
                    title,
                    price,
                    mpLink,
                    desc,
                    image: evt.target.result
                };

                let products = JSON.parse(localStorage.getItem('hmdp_products') || '[]');
                products.push(newProduct);
                localStorage.setItem('hmdp_products', JSON.stringify(products));

                document.getElementById('productForm').reset();
                toggleAdminModal();
                loadProducts();
            };

            if (imgInput.files[0]) {
                reader.readAsDataURL(imgInput.files[0]);
            }
        });

        function deleteProduct(id) {
            if (confirm("¿Deseas borrar este producto del catálogo?")) {
                let products = JSON.parse(localStorage.getItem('hmdp_products') || '[]');
                products = products.filter(p => p.id !== id);
                localStorage.setItem('hmdp_products', JSON.stringify(products));
                loadProducts();
            }
        }

        function loadProducts() {
            const catalogGrid = document.getElementById('catalogGrid');
            catalogGrid.innerHTML = '';
            let products = JSON.parse(localStorage.getItem('hmdp_products') || '[]');
            const cfg = getConfig();

            if (currentFilter !== 'todas') {
                products = products.filter(p => p.category === currentFilter);
            }

            if (products.length === 0) {
                catalogGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No hay trabajos publicados en esta categoría aún.</p>';
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';

                const waMessage = encodeURIComponent(`Hola Herrería Mar del Plata! Me interesa consultar por: ${p.title} ($${p.price})`);
                const waUrl = `https://wa.me/${cfg.phone}?text=${waMessage}`;

                let mpBtnHtml = '';
                if (p.mpLink) {
                    mpBtnHtml = `<a href="${p.mpLink}" target="_blank" class="btn-mp"><i class="fa-solid fa-credit-card"></i> Pagar con Mercado Pago</a>`;
                }

                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${p.image}" class="product-img" alt="${p.title}">
                        <span class="product-badge">${p.category}</span>
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="product-price">$${Number(p.price).toLocaleString()}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-buttons">
                            ${mpBtnHtml}
                            <a href="${waUrl}" target="_blank" class="btn-wa"><i class="fa-brands fa-whatsapp"></i> Cotizar por WhatsApp</a>
                        </div>
                        <button class="btn-delete-item" onclick="deleteProduct(${p.id})">🗑️ Eliminar Producto</button>
                    </div>
                `;
                catalogGrid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyConfig();
            loadProducts();
        });
    </script>
</body>
</html>
